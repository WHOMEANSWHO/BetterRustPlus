name: BetterRustPlus public checks

on:
  push:
    branches: [master, 'betterrustplus/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop and Genetics Lab
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RustPlusDesktop/Features/GeneticsLab/package-lock.json
      - name: Configure a public development build
        shell: pwsh
        run: Set-Content -LiteralPath .env -Value '# Public build; no cloud credentials configured.'
      - name: Build Genetics Lab
        working-directory: RustPlusDesktop/Features/GeneticsLab
        run: |
          npm ci
          npm test
          npm run build
      - name: Test desktop code
        run: dotnet test RustPlusDesktop.Tests/RustPlusDesktop.Tests.csproj -c Release -p:SkipGeneticsLabBuild=true -p:UseSharedCompilation=false --logger trx
      - name: Test companion pairing library offline
        run: dotnet test BetterRustPlus.Companion.Tests/BetterRustPlus.Companion.Tests.csproj -c Release --logger trx

  alert-service:
    name: Native Linux listener
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test guided VPS setup without external connections
        run: python3 -m unittest discover -s BetterRustPlus.Server/deploy/tests -v
      - name: Build the service
        run: dotnet build BetterRustPlus.Server/BetterRustPlus.Server.csproj -c Release
      - name: Check alert processing without Discord delivery
        run: dotnet run --project BetterRustPlus.Server/Tests/BetterRustPlus.Alerts.Tests.csproj -c Release
      - name: Check Discord bot policy without connecting
        run: dotnet run --project BetterRustPlus.Server/Bot.Tests/BetterRustPlus.Bot.Tests.csproj -c Release
      - name: Prepare private native test configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, sys
          directory = pathlib.Path('BetterRustPlus.Server/deploy').resolve()
          sys.path.insert(0, str(directory))
          import setup_docker as config
          values = config.base_config('ci-server')
          values['BETTERRUSTPLUS_INGEST_KEY'] += '-$UNDEFINED-${UNDEFINED}-#literal'
          config.write_config(directory / '.env', values)
          print('Native test configuration prepared; Rust+ and Discord remain disabled.')
          PY
      - name: Install and check native systemd service without game or Discord connections
        shell: bash
        run: |
          set -euo pipefail
          trap 'sudo journalctl -u betterrustplus -n 50 --no-pager; sudo systemctl disable --now betterrustplus' EXIT
          sudo env PATH="$PATH" DOTNET_ROOT="${DOTNET_ROOT:-/usr/share/dotnet}" python3 BetterRustPlus.Server/deploy/setup.py --install
          sudo systemd-analyze verify /etc/systemd/system/betterrustplus.service
          test "$(sudo systemctl show betterrustplus -p DynamicUser --value)" = yes
          test "$(sudo systemctl show betterrustplus -p ActiveState --value)" = active
          python3 - <<'PY'
          import datetime, json, pathlib, subprocess, urllib.request, uuid
          source = pathlib.Path('BetterRustPlus.Server/deploy/.env').read_text()
          key = next(line.split('=', 1)[1][1:-1] for line in source.splitlines()
                     if line.startswith('BETTERRUSTPLUS_INGEST_KEY='))
          base = 'http://127.0.0.1:5088'
          with urllib.request.urlopen(base + '/health', timeout=5) as response:
              health = json.load(response)
          pid = int(subprocess.check_output(['systemctl', 'show', 'betterrustplus', '-p', 'MainPID', '--value']))
          assert health['processId'] == pid and pid > 0
          assert health['mode'] == 'dry-run'
          assert health['gameSourceConnected'] is False
          assert health['discordBot'] == 'disabled'
          event = dict(id=str(uuid.uuid4()), serverId='ci-server', kind='cargo',
                       occurredAt=datetime.datetime.now(datetime.timezone.utc).isoformat(), evidence='confirmed')
          def send():
              request = urllib.request.Request(base + '/events', data=json.dumps(event).encode(),
                  headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(request, timeout=5) as response:
                  return json.load(response)
          result = send()
          assert result['simulated'] == 1 and result['delivered'] == 0
          assert send()['duplicate'] == 1
          print('Native startup, process identity, private env literals and dry-run delivery checks passed.')
          PY
